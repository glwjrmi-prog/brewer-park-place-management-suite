<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Brewer Park Place Management Suite</title>
  <style>
    body{font-family:Segoe UI,Arial,sans-serif;margin:0;background:#eef3ef;color:#173a29}
    .loading{min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{background:#fff;border:1px solid #d6e0da;border-radius:18px;padding:24px;max-width:680px;box-shadow:0 14px 32px rgba(20,42,30,.09)}
    h1{margin:0 0 8px}p{line-height:1.5}.err{color:#ad3e3e;white-space:pre-wrap}
  </style>
</head>
<body>
  <div class="loading"><div class="card"><h1>Brewer Park Place Management Suite</h1><p>Loading the protected cloud Management Suite…</p><div id="msg"></div></div></div>
  <script>
  (async()=>{
    const msg=document.getElementById('msg');
    const source='https://raw.githubusercontent.com/glwjrmi-prog/brewer-park-place-management-suite/3c37610d2c9d85b25765ee54d2ed3253a91d041e/index.html';
    try{
      const [htmlRes,bridgeRes,toolsRes,driveRes,auditRes,uiRes]=await Promise.all([
        fetch(source,{cache:'no-store'}),
        fetch('./d1-authoritative-bridge.js',{cache:'no-store'}),
        fetch('./d1-tools-ui-patch.js',{cache:'no-store'}),
        fetch('./d1-drive-picker-patch.js',{cache:'no-store'}),
        fetch('./d1-audit-provenance-patch.js',{cache:'no-store'}),
        fetch('./d1-production-ui-patch.js',{cache:'no-store'})
      ]);
      for(const r of [htmlRes,bridgeRes,toolsRes,driveRes,auditRes,uiRes]) if(!r.ok) throw new Error('A required Management Suite component could not be loaded ('+r.status+').');
      let html=await htmlRes.text();
      html=html
        .replace(/Version 8\.29/g,'Version 9.0')
        .replace(/Management Suite v8\.32/g,'Management Suite v9.0')
        .replace(/Export backups regularly\./g,'Protected cloud data · automatic revision safety');
      let bridge=await bridgeRes.text();
      const replacements=[
        ['https://bpp-management-suite-staging-api.glwjrmi.workers.dev','https://bpp-management-suite-production-api.glwjrmi.workers.dev'],
        ['BPPMS_V9_STAGING_TOKEN','BPPMS_V9_PRODUCTION_TOKEN'],
        ['BPPMS_V9_CONFLICT_COPY_','BPPMS_V9_PROD_CONFLICT_COPY_'],
        ['BPPMS_V9_BLOCKED_COPY_','BPPMS_V9_PROD_BLOCKED_COPY_'],
        ['D1 STAGING','Cloud'],
        ['Protected Cloud Staging','Protected Cloud'],
        ['authoritative D1 staging database','authoritative cloud database'],
        ['Authoritative staging database','Authoritative cloud database'],
        ['protected staging key','protected production key'],
        ['staging key','production key'],
        ['Staging user','Authorized user'],
        ['D1 Staging','Protected Cloud'],
        ['protected D1 staging','protected cloud']
      ];
      for(const [a,b] of replacements) bridge=bridge.split(a).join(b);
      const escScript=s=>s.replace(/<\/script/gi,'<\\/script');
      const tools=escScript(await toolsRes.text());
      const drive=escScript(await driveRes.text());
      const audit=escScript(await auditRes.text());
      const ui=escScript(await uiRes.text());
      bridge=escScript(bridge);
      const compat=escScript(`(function(){document.addEventListener('click',function(e){const tools=e.target&&e.target.closest?e.target.closest('#cloudToolsBtn'):null;if(tools&&!tools.onclick&&typeof bppOpenCloudTools==='function'){e.preventDefault();bppOpenCloudTools();return}const about=e.target&&e.target.closest?e.target.closest('#aboutBtn'):null;if(about&&!about.onclick&&typeof openAboutDialog==='function'){e.preventDefault();openAboutDialog();}});})();`);
      const injected=html.replace('</body>','<script>'+bridge+'<\/script><script>'+tools+'<\/script><script>'+drive+'<\/script><script>'+audit+'<\/script><script>'+ui+'<\/script><script>'+compat+'<\/script></body>');
      document.open();document.write(injected);document.close();
    }catch(e){msg.className='err';msg.textContent='Management Suite startup error: '+(e&&e.message?e.message:String(e));}
  })();
  </script>
</body>
</html>
