name: BPP Policy Advisor Read-Only Connection Check
on:
  push:
    branches:
      - feature/maintenance-intake-prototype-2026-11-19
    paths:
      - '.github/workflows/maintenance-advisor-connection-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  advisor-connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify existing Advisor accepts general maintenance question
        run: node experiments/maintenance-intake/staging-api/policy-advisor-live-check.mjs
