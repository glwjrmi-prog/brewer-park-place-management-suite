name: BPP trusted staging lookup - offline checks ONLY
on:
  push:
    paths:
      - 'integration/trusted-staging-read/**'
      - '.github/workflows/trusted-staging-read-offline-check.yml'
  pull_request:
    paths:
      - 'integration/trusted-staging-read/**'
      - '.github/workflows/trusted-staging-read-offline-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node integration/trusted-staging-read/staging-trusted-read.test.mjs
