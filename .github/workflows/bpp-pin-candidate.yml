name: BPP PIN candidate security tests
on:
  push:
    branches:
      - bpp-pin-production-prep-2026-11-04
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pin-auth-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local Cloudflare Worker/D1 emulator
        run: npm install --no-save --no-package-lock miniflare@3
      - name: Syntax check candidate
        run: node --check production-prep/WORKER_AUTH_CANDIDATE.js
      - name: Assert secure enrollment UI and server actor contracts
        run: node --test production-prep/enrollment-ui.contract.test.mjs
      - name: Syntax check production client bridge
        run: node --check production-prep/PIN_BRIDGE_CANDIDATE.js
      - name: Syntax check isolated full-suite test Worker and bridge
        run: |
          node --check production-prep/WORKER_PIN_TEST_WITH_LOGIN_PAGE.js
          node --check production-prep/ISOLATED_TEST_BRIDGE.js
      - name: Run synthetic authentication tests
        run: node --test production-prep/auth-candidate.test.mjs
      - name: Validate current production launcher integration contract
        run: node --test production-prep/launcher-contract.test.mjs
      - name: Test fail-closed PIN production readiness gate
        run: python production-prep/credential_cutover_guard.test.py
      - name: Test in-memory credential migration rehearsal
        run: python production-prep/credential_migration_rehearsal.test.py
      - name: Test read-only credential-history audit on synthetic SQL export
        run: python production-prep/credential_history.test.py
      - name: Syntax check isolated enrollment test Worker
        run: node --check production-prep/WORKER_PIN_ENROLLMENT_TEST.js
      - name: Syntax check peppered PIN experiment
        run: node --check production-prep/WORKER_PEPPER_EXPERIMENT.js
      - name: Test peppered PIN experiment using isolated D1
        run: node --test production-prep/peppered-pin.integration.test.mjs
      - name: Run isolated Cloudflare runtime and D1 integration test
        run: node --test production-prep/miniflare-d1.integration.test.mjs
