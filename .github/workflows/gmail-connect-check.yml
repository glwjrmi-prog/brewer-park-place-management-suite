name: Review standalone Gmail authorization page (NO DEPLOYMENT)
on:
  pull_request:
    paths:
      - 'gmail-connect.html'
      - 'tests/gmail-connect.test.mjs'
      - '.github/workflows/gmail-connect-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/gmail-connect.test.mjs
