name: BPP Advisor GET vs POST Diagnostics
on:
  push:
    branches:
      - feature/maintenance-intake-prototype-2026-11-19
    paths:
      - '.github/workflows/maintenance-advisor-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Compare health and generic question request
        run: node experiments/maintenance-intake/staging-api/policy-advisor-diagnostics.mjs
