name: Maintenance Intake Sandbox Tests
on:
  pull_request:
    paths:
      - 'experiments/maintenance-intake/**'
      - '.github/workflows/maintenance-intake-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Run isolated regression tests (no deployment)
        run: node --experimental-sqlite --test experiments/maintenance-intake/staging-api/access-auth.test.mjs experiments/maintenance-intake/staging-api/private-test-gateway.test.mjs experiments/maintenance-intake/staging-api/notification-planner.test.mjs experiments/maintenance-intake/staging-api/board-dispatch.test.mjs experiments/maintenance-intake/staging-api/gmail-board-sender.test.mjs experiments/maintenance-intake/staging-api/gmail-oauth.test.mjs experiments/maintenance-intake/staging-api/unit-authorization.test.mjs experiments/maintenance-intake/staging-api/verified-unit-registry.test.mjs experiments/maintenance-intake/staging-api/private-test-worker-dashboard.test.mjs experiments/maintenance-intake/staging-api/d1-access-protected-health.test.mjs experiments/maintenance-intake/staging-api/bootstrap-new-d1.test.mjs experiments/maintenance-intake/staging-api/d1-readonly-connection-check.test.mjs experiments/maintenance-intake/staging-api/worker.test.mjs experiments/maintenance-intake/staging-api/worker-dashboard-bundle.test.mjs experiments/maintenance-intake/staging-api/resident-access.test.mjs experiments/maintenance-intake/staging-api/resident-login-orchestrator.test.mjs experiments/maintenance-intake/staging-api/resident-login-rate-limit.test.mjs experiments/maintenance-intake/staging-api/policy-advisor.test.mjs experiments/maintenance-intake/staging-api/advisor-upstream-diagnostics.test.mjs experiments/maintenance-intake/staging-api/advisor-timing-instrumentation.test.mjs experiments/maintenance-intake/staging-api/responses-worker-repair.test.mjs experiments/maintenance-intake/staging-api/resident-advisor-browser.test.mjs experiments/maintenance-intake/staging-api/resident-file-search-contract.test.mjs experiments/maintenance-intake/work-order-adapter.test.mjs experiments/maintenance-intake/staging-transfer.test.mjs experiments/maintenance-intake/site-policy-advisor-integration.test.mjs

      - name: Verify public Policy Advisor interface (read-only GET)
        run: node experiments/maintenance-intake/staging-api/public-advisor-readonly-check.mjs
      - name: Verify live staging public routes deny requests (no writes)
        run: node experiments/maintenance-intake/staging-api/live-disabled-gate-check.mjs
      - name: Inspect live staging D1 schema over read-only health endpoint
        continue-on-error: true
        run: node experiments/maintenance-intake/staging-api/live-health-check.mjs
